<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="stonemegan.dev hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4f5a"/>
      <stop offset="50%" stop-color="#2c7a8c"/>
      <stop offset="100%" stop-color="#58b872"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
    <radialGradient id="warmth" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ed8c2e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ed8c2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#dots)"/>
  <rect width="1600" height="600" fill="url(#warmth)"/>
  <g opacity="0.18" fill="none" stroke="#ffffff" stroke-width="1.5">
    <circle cx="1320" cy="180" r="80"/>
    <circle cx="1320" cy="180" r="140"/>
    <circle cx="1320" cy="180" r="220"/>
  </g>
</svg>
